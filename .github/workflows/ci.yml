name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation tools
        run: pip install pytest ruff yamllint
      - name: Validate
        run: ./scripts/validate.sh
      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan files and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - context: docker/n8n
            dockerfile: docker/n8n/Dockerfile
            tag: n8n-snowflake:test
          - context: proxy/cortex
            dockerfile: proxy/cortex/Dockerfile
            tag: cortex-proxy:test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: ${{ matrix.image.tag }}
          build-args: |
            N8N_VERSION=${{ vars.N8N_VERSION || '2.34.5' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
