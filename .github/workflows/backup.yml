name: Backup Workflows

on:
  workflow_dispatch:
  # Uncomment to enable scheduled backups:
  # schedule:
  #   - cron: "0 2 * * 0"  # Weekly, Sunday 02:00 UTC

permissions:
  contents: read
  id-token: write

jobs:
  backup:
    if: vars.ENABLE_BACKUP == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.16"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export n8n workflows to stage
        env:
          SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_DEPLOY_USER }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_DEPLOY_ROLE }}
          SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
        run: |
          snow sql -x -q "CREATE STAGE IF NOT EXISTS ${{ vars.SNOWFLAKE_DATABASE }}.${{ vars.SNOWFLAKE_SCHEMA }}.N8N_BACKUPS ENCRYPTION = (TYPE = 'SNOWFLAKE_SSE') COMMENT = 'Workflow backup exports';"

          ENDPOINT=$(snow sql -x -q "SHOW ENDPOINTS IN SERVICE ${{ vars.SNOWFLAKE_DATABASE }}.${{ vars.SNOWFLAKE_SCHEMA }}.N8N_SERVICE" --format JSON 2>/dev/null \
            | python3 -c "import json,sys; eps=[e for e in json.load(sys.stdin) if e.get('name','')=='n8n-ui']; print(eps[0]['ingress_url'] if eps else '')" || true)

          if [ -z "$ENDPOINT" ]; then
            echo "::warning::n8n service endpoint not found. Is the service running?"
            exit 0
          fi

          TOKEN=$(snow spcs image-registry token -x --format JSON \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["token"])')

          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)

          python3 -c "
          import urllib.request, json, os, sys

          endpoint = os.environ['ENDPOINT']
          token = os.environ['TOKEN']
          ts = os.environ['TIMESTAMP']
          out_dir = '/tmp/n8n_backup'
          os.makedirs(out_dir, exist_ok=True)

          # Fetch all workflows via n8n REST API
          url = f'https://{endpoint}/api/v1/workflows?limit=250'
          req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}'})
          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read())
          except Exception as e:
              print(f'::warning::Could not reach n8n API: {e}')
              sys.exit(0)

          workflows = data.get('data', [])
          print(f'Exporting {len(workflows)} workflows')

          for wf in workflows:
              wf_id = wf['id']
              name = wf.get('name', wf_id).replace('/', '_').replace(' ', '_')
              path = f'{out_dir}/{ts}_{name}_{wf_id}.json'
              with open(path, 'w') as f:
                  json.dump(wf, f, indent=2)

          print(f'Written to {out_dir}')
          "

          if ls /tmp/n8n_backup/*.json 1>/dev/null 2>&1; then
            snow stage copy /tmp/n8n_backup/*.json \
              "@${{ vars.SNOWFLAKE_DATABASE }}.${{ vars.SNOWFLAKE_SCHEMA }}.N8N_BACKUPS/workflows/" \
              --overwrite
            echo "Backup complete: $(ls /tmp/n8n_backup/*.json | wc -l) workflows exported"
          else
            echo "::warning::No workflows exported"
          fi
