name: Backup Workflows

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: n8n-snowflake-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - uses: snowflakedb/snowflake-actions@1160898243c351349621a6c2bac2e455ab1077b2  # v3
        with:
          use-oidc: true
          cli-version: "3.16"
      - name: Export and upload workflows
        env:
          N8N_BACKUP_ENDPOINT: ${{ vars.N8N_BACKUP_ENDPOINT }}
          N8N_BACKUP_STAGE: ${{ vars.N8N_BACKUP_STAGE }}
          N8N_BACKUP_INGRESS_TOKEN: ${{ secrets.N8N_BACKUP_INGRESS_TOKEN }}
          N8N_BACKUP_API_KEY: ${{ secrets.N8N_BACKUP_API_KEY }}
          SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_DEPLOY_USER }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_DEPLOY_ROLE }}
          SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
        run: |
          set -euo pipefail
          umask 077
          : "${N8N_BACKUP_STAGE:?Configure an existing private stage destination}"
          [[ "$N8N_BACKUP_STAGE" =~ ^@[A-Za-z_][A-Za-z0-9_]*\.[A-Za-z_][A-Za-z0-9_]*\.[A-Za-z_][A-Za-z0-9_]*/[A-Za-z0-9_/-]*$ ]] || exit 1
          backup_dir="$(mktemp -d)"
          trap 'rm -rf "$backup_dir"' EXIT
          archive="$backup_dir/workflows-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          python3 scripts/export_workflows.py "$archive"
          snow stage copy "$archive" "${N8N_BACKUP_STAGE%/}/"
          echo "Workflow export uploaded. Restore verification is a separate operator step."
